global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ms_auth'
    static_configs:
      - targets: ['host.docker.internal:4001']
  - job_name: 'ms_group'
    static_configs:
      - targets: ['host.docker.internal:4002']
  - job_name: 'ms_expense'
    static_configs:
      - targets: ['host.docker.internal:4003']
  - job_name: 'ms_balance'
    static_configs:
      - targets: ['host.docker.internal:4004']